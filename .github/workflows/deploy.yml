name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Секреты нельзя проверять напрямую в job.if — проверяем через env + outputs.
  # Пока секреты сервера не настроены (docs/DEPLOY.md, шаг 7), деплой пропускается.
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.set.outputs.configured }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - id: set
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Секрет хранится в base64 (одна строка — надёжнее копировать).
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "ключ валиден"

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'instance' \
            --exclude 'logs' \
            --exclude '__pycache__' \
            --exclude '.idea' \
            --exclude '.pytest_cache' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/andrey-ai-lab/"

      - name: Install dependencies and restart service
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash /opt/andrey-ai-lab/scripts/deploy.sh'
